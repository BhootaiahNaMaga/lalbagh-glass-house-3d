<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lalbagh Glass House — 3D Immersive Experience</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <canvas id="scene-canvas" aria-label="Interactive 3D view of the Lalbagh Glass House in Bengaluru"></canvas>

    <!-- Loading Curtain -->
    <div id="loading-curtain" class="loading-curtain">
      <div class="loading-card">
        <div class="loading-crest">
          <svg viewBox="0 0 64 42" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M8 38V22C8 11 18.7 4 32 4C45.3 4 56 11 56 22V38" stroke="currentColor" stroke-width="2" />
            <path d="M16 38V24C16 15.5 23.2 10 32 10C40.8 10 48 15.5 48 24V38" stroke="currentColor" stroke-width="1.3" opacity="0.7" />
            <line x1="32" y1="4" x2="32" y2="38" stroke="currentColor" stroke-width="1.2" opacity="0.75" />
            <line x1="4" y1="38" x2="60" y2="38" stroke="currentColor" stroke-width="2" />
            <line x1="32" y1="4" x2="14" y2="21" stroke="currentColor" stroke-width="1" opacity="0.55" />
            <line x1="32" y1="4" x2="50" y2="21" stroke="currentColor" stroke-width="1" opacity="0.55" />
          </svg>
        </div>
        <h1>Lalbagh Glass House</h1>
        <p>Constructing cast-iron ribs, glass vaults &amp; botanical gardens…</p>
        <div class="loading-bar"><span id="loading-progress"></span></div>
      </div>
    </div>

    <!-- Floating World-Space Hotspots Layer -->
    <div id="hotspots-layer" class="hotspots-layer" aria-live="polite"></div>

    <!-- HUD Overlay -->
    <div id="hud-root" class="hud-root">
      <!-- Top Bar -->
      <header class="hud-top">
        <div class="brand-cluster">
          <div class="brand-pill glass-panel">
            <div class="brand-emblem" aria-hidden="true">❖</div>
            <div>
              <div class="brand-title">Lalbagh Glass House</div>
              <div class="brand-sub">Albert Victor Conservatory • Bengaluru, 1889</div>
            </div>
          </div>

          <div id="walk-hint-badge" class="walk-hint glass-panel hidden">
            <span><strong>WASD</strong> / Arrows to walk • <strong>Shift</strong> brisk • <strong>Drag</strong> to look</span>
            <button id="btn-pointer-lock" class="mini-btn" type="button" title="Lock cursor for seamless FPS mouse look">
              Lock Cursor
            </button>
          </div>

          <div id="tour-banner" class="tour-banner glass-panel hidden">
            <span class="tour-dot"></span>
            <span id="tour-caption">Guided Tour — Grand Approach</span>
            <button id="btn-tour-toggle" class="mini-btn" type="button">Pause [Space]</button>
          </div>
        </div>

        <div class="top-actions glass-panel">
          <button id="btn-quality" class="action-pill active" type="button" title="Toggle Level 1 Cinematic Post-Processing (GTAO + Bloom) [Q]">
            <span class="pill-icon">◈</span>
            <span>Cinematic</span>
          </button>
          <button id="btn-hotspots" class="action-pill active" type="button" title="Toggle Heritage Hotspots [I]">
            <span class="pill-icon">✦</span>
            <span>Hotspots</span>
          </button>
          <button id="btn-audio" class="action-pill" type="button" title="Toggle Garden Soundscape">
            <span class="pill-icon">♪</span>
            <span>Audio</span>
          </button>
          <button id="btn-hide-hud" class="action-pill" type="button" title="Toggle HUD [H]">
            <span class="pill-icon">◱</span>
            <span>Hide HUD</span>
          </button>
        </div>
      </header>

      <!-- Heritage Info Drawer -->
      <aside id="heritage-card" class="heritage-card glass-panel hidden" aria-hidden="true">
        <div class="heritage-header">
          <span id="heritage-tag" class="heritage-tag">1889 Heritage</span>
          <button id="btn-close-heritage" class="icon-close" type="button" aria-label="Close card">✕</button>
        </div>
        <h2 id="heritage-title">Foundation &amp; Royal Vision</h2>
        <p id="heritage-body"></p>
        <div id="heritage-meta" class="heritage-meta"></div>
      </aside>

      <!-- Bottom Floating Dock -->
      <footer class="hud-bottom">
        <div class="dock glass-panel">
          <!-- Row 1: Mode, Time, Display -->
          <div class="dock-row dock-row-controls">
            <div class="control-group" role="group" aria-label="Camera Mode">
              <span class="group-label">Mode</span>
              <div class="segmented" id="mode-group">
                <button class="seg-btn active" data-mode="orbit" type="button">Orbit</button>
                <button class="seg-btn" data-mode="walk" type="button">Walk</button>
                <button class="seg-btn" data-mode="tour" type="button">Tour</button>
              </div>
            </div>

            <div class="divider-v" aria-hidden="true"></div>

            <div class="control-group" role="group" aria-label="Time of Day">
              <span class="group-label">Light</span>
              <div class="segmented" id="time-group">
                <button class="seg-btn active" data-time="morning" type="button">Morning</button>
                <button class="seg-btn" data-time="midday" type="button">Midday</button>
                <button class="seg-btn" data-time="golden" type="button">Golden</button>
                <button class="seg-btn" data-time="night" type="button">Night</button>
              </div>
            </div>

            <div class="divider-v" aria-hidden="true"></div>

            <div class="control-group" role="group" aria-label="Exhibition Mode">
              <span class="group-label">Interior</span>
              <div class="segmented" id="display-group">
                <button class="seg-btn active" data-display="flower-show" type="button">Flower Show</button>
                <button class="seg-btn" data-display="conservatory" type="button">Conservatory</button>
              </div>
            </div>
          </div>

          <!-- Row 2: 7 Curated Viewpoints -->
          <div class="dock-row dock-row-views" role="group" aria-label="Camera Viewpoints">
            <span class="group-label">Views</span>
            <div class="view-pills" id="viewpoint-group">
              <button class="view-btn active" data-view="approach" type="button">1 · Approach</button>
              <button class="view-btn" data-view="portico" type="button">2 · Portico</button>
              <button class="view-btn" data-view="crossing" type="button">3 · Crossing</button>
              <button class="view-btn" data-view="nave" type="button">4 · Nave</button>
              <button class="view-btn" data-view="floral" type="button">5 · Floral</button>
              <button class="view-btn" data-view="canopy" type="button">6 · Canopy</button>
              <button class="view-btn" data-view="lawn" type="button">7 · Lawn Vista</button>
            </div>
          </div>
        </div>
      </footer>
    </div>

    <!-- Restore HUD pill when hidden -->
    <button id="btn-show-hud" class="show-hud-pill glass-panel hidden" type="button">
      Show HUD [H]
    </button>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
